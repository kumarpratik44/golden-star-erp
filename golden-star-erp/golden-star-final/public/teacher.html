<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Portal | Golden Star International School</title>
<link rel="icon" href="/assets/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="topbar"></div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="students">My Students</button>
    <button class="tab-btn" data-tab="attendance">Attendance</button>
    <button class="tab-btn" data-tab="results">Results</button>
    <button class="tab-btn" data-tab="content">Subject Updates</button>
  </div>

  <section class="tab-panel active" id="tab-students">
    <div class="card">
      <h3>Students in My Assigned Class</h3>
      <div class="table-wrap">
        <table id="studentsTable">
          <thead><tr><th>Admission</th><th>Name</th><th>Class</th><th>Section</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tab-attendance">
    <div class="card">
      <h3>Mark Attendance</h3>
      <div class="grid cols-2">
        <div><label>Date</label><input id="a_date" type="date"></div>
        <div><label>Student</label><select id="a_student"></select></div>
      </div>
      <label>Status</label>
      <select id="a_status"><option>Present</option><option>Absent</option><option>Leave</option></select>
      <button class="btn" id="a_submit">Mark Attendance</button>
      <div id="attendanceMsg"></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-results">
    <div class="card">
      <h3>Post Result</h3>
      <form id="resultForm">
        <label>Student</label>
        <select id="r_student" required></select>
        <label>Term</label>
        <input id="r_term" placeholder="Term 1">
        <label>Exam</label>
        <input id="r_exam" required placeholder="Mid-Term">
        <label>Subject</label>
        <input id="r_subject" required>
        <div class="grid cols-2">
          <div><label>Max Marks</label><input id="r_max" type="number" min="1" required></div>
          <div><label>Obtained</label><input id="r_obtained" type="number" min="0" required></div>
        </div>
        <button class="btn">Post Result &amp; Notify</button>
      </form>
      <div id="resultMsg"></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-content">
    <div class="card">
      <h3>Publish Subject Update</h3>
      <form id="contentForm">
        <label>Subject</label>
        <select id="c_subject" required></select>
        <label>Title</label>
        <input id="c_title" required placeholder="Homework / Topic / Announcement">
        <label>Content</label>
        <textarea id="c_body" rows="5" required></textarea>
        <button class="btn">Publish Update</button>
      </form>
      <div id="contentMsg"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>My Published Updates</h3>
      <div id="contentList"></div>
    </div>
  </section>
</div>

<div id="footer"></div>
<script src="/js/common.js"></script>
<script src="/js/teacher.js"></script>
</body>
</html>
