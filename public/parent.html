<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parent Portal | Golden Star International School</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topbar"></div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" data-tab="child">Child</button>
    <button class="tab-btn" data-tab="results">Results</button>
    <button class="tab-btn" data-tab="attendance">Attendance</button>
    <button class="tab-btn" data-tab="timetable">Timetable</button>
    <button class="tab-btn" data-tab="holidays">Holidays</button>
    <button class="tab-btn" data-tab="notices">Notifications</button>
  </div>

  <section class="tab-panel active" id="tab-child">
    <div class="card">
      <h3>Child Information</h3>
      <div id="childProfile"></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-results">
    <div class="card">
      <h3>Results</h3>
      <div class="table-wrap">
        <table id="resultsTable">
          <thead><tr><th>Term</th><th>Exam</th><th>Subjects &amp; Marks</th><th>Total</th><th>%</th><th>Grade</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tab-attendance">
    <div class="card">
      <h3>Attendance</h3>
      <div class="table-wrap">
        <table id="attendanceTable">
          <thead><tr><th>Date</th><th>Status</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tab-timetable">
    <div class="card">
      <h3>Child's Timetable</h3>
      <div class="table-wrap">
        <table id="ttTable">
          <thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Room</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="tab-panel" id="tab-holidays">
    <div class="card">
      <h3>School Holidays &amp; Events</h3>
      <div id="holidayList"></div>
    </div>
  </section>

  <section class="tab-panel" id="tab-notices">
    <div class="card">
      <h3>Notifications</h3>
      <div id="noticesList"></div>
    </div>
  </section>
</div>

<div id="footer"></div>
<script src="/js/common.js"></script>
<script src="/js/parent.js"></script>
</body>
</html>
